name: test-infrastructure
run-name: Test infrastructure
on:
  pull_request:
  # push:
  #   branches: main
# A new push replaces the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Build the images once per Ubuntu version; the test jobs load them.
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu version of the container images; the runner stays on 24.04.
        version: ["24.04", "26.04"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker CLI
        uses: docker/setup-buildx-action@v3
      - name: Build vpnc image
        uses: docker/build-push-action@v6
        with:
          load: true
          context: .
          file: docker/${{ matrix.version }}/Dockerfile
          target: vpnc
          tags: nc-vpnc:latest
          cache-from: type=gha,scope=$GITHUB_REF_NAME-${{ matrix.version }}
      - name: Build lab image and cache layers
        uses: docker/build-push-action@v6
        with:
          load: true
          context: .
          file: docker/${{ matrix.version }}/Dockerfile
          target: lab
          tags: nc-vpnc-lab:latest
          cache-from: type=gha,scope=$GITHUB_REF_NAME-${{ matrix.version }}
          cache-to: type=gha,scope=$GITHUB_REF_NAME-${{ matrix.version }},mode=max
      - name: Save images
        run: docker save nc-vpnc:latest nc-vpnc-lab:latest | zstd -T0 -3 > images.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.version }}
          path: images.tar.zst
          retention-days: 1
          compression-level: 0

  # Each shard deploys its own lab, as the reliability tests disrupt it.
  test:
    needs: build
    name: test (${{ matrix.version }}, ${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        version: ["24.04", "26.04"]
        shard:
          - name: sanity
            lab: base
            tests: test/01_sanity
          - name: vpn-recovery
            lab: base
            tests: test/02_reliability/reliability_tests/test_vpn_recovery.py
          - name: reliability
            lab: base
            tests: >-
              test/02_reliability
              --ignore=test/02_reliability/reliability_tests/test_vpn_recovery.py
          - name: performance
            lab: scale
            # -rP shows the measurements (printed by passing tests).
            tests: test/03_performance -rP
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install runner dependencies (Jool, containerlab)
        # sudo drops the environment; install.sh skips the upgrade in Actions.
        run: sudo --preserve-env=GITHUB_ACTIONS test/00_setup/install.sh
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ matrix.version }}
      - name: Load images
        run: zstd -dc images.tar.zst | docker load
      - name: Deploy the ${{ matrix.shard.lab }} lab
        run: sudo test/00_setup/deploy-${{ matrix.shard.lab }}.sh
      - name: Wait for the base lab
        if: matrix.shard.lab == 'base'
        run: sudo test/00_setup/healthcheck.sh
      - name: Run tests
        run: sudo python3 -m pytest -v ${{ matrix.shard.tests }}
      - name: Show lab diagnostics
        if: failure()
        run: sudo test/00_setup/diagnostics.sh
