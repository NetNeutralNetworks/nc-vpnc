name: test-infrastructure
run-name: Test infrastructure
on:
  pull_request:
  # push:
  #   branches: main
jobs:
  # Build the images once per Ubuntu version; the test jobs load them.
  build:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu version of the container images; the runner stays on 24.04.
        version: ["24.04", "26.04"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker CLI
        uses: docker/setup-buildx-action@v3
      - name: Build vpnc image
        uses: docker/build-push-action@v6
        with:
          load: true
          context: .
          file: docker/${{ matrix.version }}/Dockerfile
          target: vpnc
          tags: nc-vpnc:latest
          cache-from: type=gha,scope=$GITHUB_REF_NAME-${{ matrix.version }}
      - name: Build lab image and cache layers
        uses: docker/build-push-action@v6
        with:
          load: true
          context: .
          file: docker/${{ matrix.version }}/Dockerfile
          target: lab
          tags: nc-vpnc-lab:latest
          cache-from: type=gha,scope=$GITHUB_REF_NAME-${{ matrix.version }}
          cache-to: type=gha,scope=$GITHUB_REF_NAME-${{ matrix.version }},mode=max
      - name: Save images
        run: docker save nc-vpnc:latest nc-vpnc-lab:latest | zstd -T0 -3 > images.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ matrix.version }}
          path: images.tar.zst
          retention-days: 1
          compression-level: 0

  # Each shard deploys its own lab, as the failure tests disrupt it.
  test:
    needs: build
    name: test (${{ matrix.version }}, ${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        version: ["24.04", "26.04"]
        shard:
          - name: base
            tests: test/01_base_config test/02_high_availability
          - name: vpn-recovery
            tests: test/03_failure_recovery/failure_tests/test_vpn_recovery.py
          - name: other-recovery
            tests: >-
              test/03_failure_recovery
              --ignore=test/03_failure_recovery/failure_tests/test_vpn_recovery.py
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install runner dependencies (Jool, containerlab)
        run: sudo test/00_setup/install.sh
      - uses: actions/download-artifact@v4
        with:
          name: images-${{ matrix.version }}
      - name: Load images
        run: zstd -dc images.tar.zst | docker load
      - name: Run containerlab test environment
        run: cd test/00_setup && sudo containerlab deploy && cd $OLDPWD && sudo test/00_setup/healthcheck.sh
      - name: Run tests
        run: sudo python3 -m pytest -v ${{ matrix.shard.tests }}
      - name: Show lab diagnostics
        if: failure()
        run: sudo test/00_setup/diagnostics.sh
