name: test-infrastructure
run-name: Test infrastructure
on:
  pull_request:
  # push:
  #   branches: main
# A new push replaces the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Next to the build: the tests wait for both.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The version of the VS Code extension: the editor and CI agree.
      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.6"
      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.6"
          args: format --check --diff

  # Build the images once; the test jobs load them.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker CLI
        uses: docker/setup-buildx-action@v4
      - name: Build vpnc image
        uses: docker/build-push-action@v7
        with:
          load: true
          context: .
          file: docker/26.04/Dockerfile
          target: vpnc
          tags: nc-vpnc:latest
          cache-from: type=gha,scope=${{ github.ref_name }}-26.04
      - name: Build lab image and cache layers
        uses: docker/build-push-action@v7
        with:
          load: true
          context: .
          file: docker/26.04/Dockerfile
          target: lab
          tags: nc-vpnc-lab:latest
          cache-from: type=gha,scope=${{ github.ref_name }}-26.04
          cache-to: type=gha,scope=${{ github.ref_name }}-26.04,mode=max
      - name: Save images
        run: docker save nc-vpnc:latest nc-vpnc-lab:latest | zstd -T0 -3 > images.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.zst
          retention-days: 1
          compression-level: 0

  # Each shard deploys its own lab, as the reliability tests disrupt it. The
  # reliability shards take about 10 minutes each; a lab takes 4 to set up.
  test:
    needs: [lint, build]
    name: test (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: sanity
            lab: base
            tests: test/01_sanity
          - name: vpn-recovery
            lab: base
            tests: test/02_reliability/reliability_tests/test_vpn_recovery.py
          - name: stuck-recovery
            lab: base
            tests: >-
              test/02_reliability/reliability_tests/test_stuck_recovery.py
              test/02_reliability/reliability_tests/test_tunnel_recovery.py
              test/02_reliability/reliability_tests/test_route_recovery.py
          - name: connections
            lab: base
            tests: >-
              test/02_reliability/reliability_tests/test_probe_recovery.py
              test/02_reliability/reliability_tests/test_ssh_recovery.py
              test/02_reliability/reliability_tests/test_diagnosis.py
              test/02_reliability/reliability_tests/test_connection_control.py
          # The other reliability tests, also ones added later.
          - name: reconfiguration
            lab: base
            tests: >-
              test/02_reliability
              --ignore=test/02_reliability/reliability_tests/test_vpn_recovery.py
              --ignore=test/02_reliability/reliability_tests/test_stuck_recovery.py
              --ignore=test/02_reliability/reliability_tests/test_tunnel_recovery.py
              --ignore=test/02_reliability/reliability_tests/test_route_recovery.py
              --ignore=test/02_reliability/reliability_tests/test_probe_recovery.py
              --ignore=test/02_reliability/reliability_tests/test_ssh_recovery.py
              --ignore=test/02_reliability/reliability_tests/test_diagnosis.py
              --ignore=test/02_reliability/reliability_tests/test_connection_control.py
          - name: performance
            lab: scale
            tests: test/03_performance
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Get the kernel version
        id: kernel
        run: echo "release=$(uname -r)" >> "$GITHUB_OUTPUT"
      # Jool's module built for this kernel, so it isn't built again.
      - name: Restore the Jool module
        id: jool
        uses: actions/cache/restore@v6
        with:
          path: jool-modules
          key: jool-${{ steps.kernel.outputs.release }}-${{ hashFiles('test/00_setup/install.sh') }}
      - name: Install runner dependencies (Jool, containerlab)
        # sudo drops the environment; install.sh skips the upgrade in Actions.
        run: sudo --preserve-env=GITHUB_ACTIONS,JOOL_MODULES test/00_setup/install.sh
        env:
          JOOL_MODULES: ${{ github.workspace }}/jool-modules
      - name: Save the Jool module
        if: steps.jool.outputs.cache-hit != 'true'
        # Saved by one shard; the others' tries fail harmlessly.
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: jool-modules
          key: ${{ steps.jool.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v8
        with:
          name: images
      - name: Load images
        run: zstd -dc images.tar.zst | docker load
      - name: Deploy the ${{ matrix.shard.lab }} lab
        run: sudo test/00_${{ matrix.shard.lab }}/deploy-${{ matrix.shard.lab }}.sh
      - name: Wait for the base lab
        if: matrix.shard.lab == 'base'
        run: sudo test/00_base/healthcheck.sh
      - name: Run tests
        run: sudo python3 -m pytest -v ${{ matrix.shard.tests }}
      - name: Show lab diagnostics
        if: failure()
        run: sudo test/00_base/diagnostics.sh
