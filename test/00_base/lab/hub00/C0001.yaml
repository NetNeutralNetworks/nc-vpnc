---
version: 0.1.4

id: C0001
name: Tenant
# Optional, arbitrary key-value pairs
metadata:
  environment: test

# Network configuration
network_instances:
  00:
    type: DOWNLINK # The only type of a tenant's network instances.
    # Optional, arbitrary key-value pairs
    metadata: {}
    connections:
      0:
        # Optional, arbitrary key-value pairs
        metadata: {}
        interface:
          # Optional: IPv6 interface address, required for downlink in endpoint mode.
          # ipv6:
          # - fdcc:cbe::/64
          # Optional: IPv4 interface address, required for downlink in endpoint mode.
          # Ignored for core in hub mode.
          # ipv4:
          # - 100.99.0.0/24
        # List of IPv4 and IPv6 networks reachable via this connection.
        # IPv6 NPTv6 can be performed for DOWNLINKs in hub mode.
        # Only global IPv6 unicast are accepted without NPTv6
        # IPv4 prefixes are ignored for CORE in hub mode.
        routes:
          ipv6:
          ipv4:
          - to: 172.16.30.1
            # via: # Optional, ignored for tunnel interfaces
        # Optional, DOWNLINK only: hosts in the routes, tested every 30 seconds from
        # the interface's address. The connection is reset when none of them
        # answers for 3 minutes. hub01 has none.
        probes:
        - description: cli00 # Optional
          address: 172.16.30.1
          test_type: ICMP # ICMP | TCP
        - address: 172.16.30.1
          test_type: TCP
          port: 22
        config:
          type: IPSEC # IPSEC | SSH | PHYSICAL
          # Optional: If not set, defaults to the default service local_id value.
          # local_id: 192.0.2.5
          # IPv6 or IPv4 address
          remote_addrs: [192.0.2.7, 2001:db8::7]
          # Optional: If not set, defaults to remote_peer_ip
          # remote_id: 192.0.2.7
          # Optional: defaults to 2
          # ike_version: 2
          # Optional: defaults to aes256gcm16-prfsha384-ecp384
          ike_proposal: aes128gcm16-prfsha384-ecp384
          # Optional: The IKE lifetime in seconds
          ike_lifetime: 300
          # Optional: defaults to aes256gcm16-prfsha384-ecp384
          ipsec_proposal: aes128gcm16-prfsha384-ecp384
          # Optional: The IPsec lifetime in seconds
          ipsec_lifetime: 90
          # Optional, defaults to START: initiate and respond. NONE: respond only.
          initiation: NONE
          psk: secretpasswordendpoint-of-the-lab
          # Optional: hybrid ML-KEM key exchange, optionally with a postquantum
          # preshared key (RFC 8784). Requires Ubuntu 26.04 (strongSwan 6).
          post_quantum:
            enabled: true
            ml_kem: ML_KEM_768 # ML_KEM_768 | ML_KEM_1024
            ppk:
              # Sent to the peer: the same on both sides, unique per node.
              # Default: the connection's name and the hostname, written on commit.
              id: C0001-00-0-hub00
              # At least 32 bytes: text, 0x hex or 0s base64.
              key: "0x66a77b5b1ff9961fcc346c2de0d28f9e985ce3c1b4d39052173116d4d9ba3811"
          # Optional
          # traffic_selectors:
          #   local:
          #   - 10.20.0.0/16
          #   - 10.21.0.0/16
          #   - fdcc:cbe::/64
          #   remote:
          #   - 172.30.0.0/16
          #   - 172.31.0.0/16
          #   - 2001:db8:c57::/48
      1:
        # Optional, arbitrary key-value pairs
        metadata: {}
        interface:
        routes:
          ipv6:
          - to: 2001:db8:c57::/48
            # via: # Optional, ignored for tunnel interfaces
            nptv6: false # Optional, configured by the service automatically.
            # nptv6_prefix: null
          - to: fdff:db8:c57::/52
            # via: # Optional, ignored for tunnel interfaces
            nptv6: true # Optional, configured by the service automatically.
            # nptv6_prefix: null
          - to: fdff:db8:c57:1000::/52
            # via: # Optional, ignored for tunnel interfaces
            nptv6: true # Optional, configured by the service automatically.
            # nptv6_prefix: null
          - to: fdff:db8:c57:2000::/56
            # via: # Optional, ignored for tunnel interfaces
            nptv6: true # Optional, configured by the service automatically.
            # nptv6_prefix: null
          - to: fdff:db8:c57:3000::/52
            # via: # Optional, ignored for tunnel interfaces
            nptv6: true # Optional, configured by the service automatically.
            # nptv6_prefix: null
          ipv4:
          - to: default
            # via: # Optional, ignored for tunnel interfaces
        probes:
        - address: 2001:db8:c57::1
          test_type: ICMP
        - address: 172.16.31.1
          test_type: ICMP
        # Nothing listens: refused, which is an answer too.
        - address: 2001:db8:c57:31::4
          test_type: TCP
          port: 81
        config:
          type: SSH # IPSEC | SSH | PHYSICAL
          remote_addrs: [172.16.30.1]
          # Required. Specifies the remote tunnel identifier to avoid overlap.
          remote_tunnel_id: 0
          # Optional: the interface on the server to masquerade out of, in the
          # script of "vpnctl connections ssh-setup" that sets up the server.
          remote_config_interface: eth0
          # An account on the server that may only open the tunnel.
          username: vpnc
          # Optional: only the hybrid ML-KEM key exchange. Requires OpenSSH 9.9+.
          post_quantum:
            enabled: true

  01:
    type: DOWNLINK
    connections:
      0:
        routes:
          ipv6:
          - to: 2001:db8:c58::/48
            nptv6: false
          - to: fdff:db8:c58::/52
            nptv6: true
          - to: fdff:db8:c58:1000::/52
            nptv6: true
          - to: fdff:db8:c58:2000::/56
            nptv6: true
          - to: fdff:db8:c58:3000::/52
            nptv6: true
          ipv4:
          - to: default
        probes:
        - address: 2001:db8:c58::1
          test_type: ICMP
        - address: 172.17.31.1
          test_type: TCP
          port: 22
        # Not in use: one probe without an answer doesn't reset the connection.
        - address: 172.17.30.9
          test_type: ICMP
        config:
          type: WIREGUARD # IPSEC | PHYSICAL | WIREGUARD
          # local_port: 51820
          remote_addrs: [192.0.2.8, 2001:db8::8]
          # remote_port: 51820
          private_key: aCIwvWZ7aknX9Lpyk40zEu2HhneHyWSxgl6NVJRU50s=
          public_key: 9xdzIRK5ARFePwKZUKZAMwXPddTRtQTlQ00J3aUEeGc=
...
