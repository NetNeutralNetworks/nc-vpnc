# Scale lab: hub00 with 200 network instances and 300 connections to peer00.
# Runs next to the base lab; deploy it with deploy-scale.sh.
name: vpnc-scale

topology:
  kinds:
    linux:
      # Unconfined, as on the VMs: podman's "runc" AppArmor label can't
      # signal FRR's daemons, which Ubuntu's profiles confine.
      security-opts:
        - apparmor=unconfined
      binds:
        - ../../:/nc-vpnc/
        - /lib/modules/:/lib/modules
  nodes:
    mgt00:
      kind: linux
      image: localhost/nc-vpnc-lab:${VPNC_VERSION:=latest}
      cmd: /nc-vpnc/test/00_base/lab/mgt/mgt00.sh
    hub00:
      kind: linux
      image: localhost/nc-vpnc:${VPNC_VERSION:=latest}
      cmd: /nc-vpnc/test/00_scale/lab/hub00/config.sh
    peer00:
      kind: linux
      image: localhost/nc-vpnc-lab:${VPNC_VERSION:=latest}
      cmd: /nc-vpnc/test/00_scale/lab/peer00/config.sh
    br-vpnc-scale:
      kind: bridge

  links:
    - endpoints: ["mgt00:eth1", "br-vpnc-scale:scale-mgt00"]
    - endpoints: ["hub00:eth1", "br-vpnc-scale:scale-hub00"]
    - endpoints: ["peer00:eth1", "br-vpnc-scale:scale-peer00"]
