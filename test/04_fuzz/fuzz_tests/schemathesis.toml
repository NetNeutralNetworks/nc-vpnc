# Schemathesis' settings for test_api_schema.py.

[checks]
enabled = false
not_a_server_error.enabled = true
response_schema_conformance.enabled = true
negative_data_rejection.enabled = true
ensure_resource_availability.enabled = true
# Not use_after_free: DELETE of a configuration stages its removal, which a
# commit applies and a discard drops.

# Valid input (by the schema) is accepted, where the schema can say what's
# valid: not in configurations, which have rules between their fields.
[[operations]]
include-path = "/v1/config/tenants"
include-method = "POST"
checks.positive_data_acceptance.enabled = true
