# /etc/strongswan.conf - strongSwan configuration file

charon {
  # https://docs.strongswan.org/docs/5.9/config/lookupTuning.html#_hash_table_size
  ikesa_table_size = 256
  # https://docs.strongswan.org/docs/5.9/config/lookupTuning.html#_locking
  ikesa_table_segments = 16
  # https://docs.strongswan.org/docs/5.9/config/rekeying.html#_reauthentication
  make_before_break = yes
  retry_initiate_interval = 60

  user = vpnc-swan
  group = vpnc-swan

  # Only what connections with a PSK need, not every installed plugin: a peer
  # reaches less before it's authenticated (no certificates, EAP or XAuth).
  # Without stroke: "ipsec status" doesn't work, swanctl does. Others also keep
  # capabilities as vpnc-swan, e.g. agent (root again) and connmark.
  load_modular = no
  load = random nonce openssl kernel-netlink socket-default vici

  # To the journal; for vpnctl's per connection logs, lines name their IKE SA.
  syslog {
    daemon {
      ike_name = yes
      default = 1
    }
  }
}

# Only installed plugins: swanctl reports every other one it was built with.
swanctl {
  load = random nonce openssl pem pkcs1 pkcs8 x509 pubkey
}
