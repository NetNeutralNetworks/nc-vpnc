# VPNC configuration to configure snmpd for FRR and vpnc (AgentX subagents).

# master: Should the agent operate as a master agent or not.
#   Currently, the only supported master agent type for this token
#   is "agentx".
#
#   arguments: (on|yes|agentx|all|off|no)

master agentx
# Unix sockets only root (vpnc) and FRR can connect to: AgentX has no
# authentication. The default one for vpnc, and the one FRR is allowed to use
# (see /etc/snmp/frr.conf).
agentXSocket /var/agentx/master,/etc/frr/agentx
agentXPerms 0660 0755 0 frr
