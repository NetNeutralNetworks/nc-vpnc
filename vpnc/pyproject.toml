[build-system]
requires = ["setuptools >= 64.0.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vpnc"
description = "Manages vpnc configuration"
readme = "README.md"
authors = [{ name="Tony Fortes Ramos", email="tony.fortesramos@ncubed.nl" }]
# watchdog 7 needs 3.11.
requires-python = ">=3.11"
keywords = ["ncubed", "vpnc", "vpn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Linux",

    # Pick your license as you wish (see also "license" above)
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi~=0.162.2",
    "Jinja2~=3.1.6",
    "pydantic~=2.14.3",
    "pyroute2~=0.9.7",
    "PyYAML~=6.0.3",
    "uvicorn~=0.54.0",
    "vici~=6.0.3",
    "watchdog~=7.1.0",
    "packaging",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "types-PyYAML",
    "types-tabulate",
]

[project.scripts]
vpnc = "vpnc.main:main"
vpnctl = "vpnc.cli.main:main"

[tool.setuptools.dynamic]
version = {attr = "vpnc.__version__"}

[tool.setuptools.package-data]
"*" = ["*.j2"]
