[build-system]
requires = ["setuptools>=84.2.1", "setuptools-scm>=10.3.4"]
build-backend = "setuptools.build_meta"

[project]
name = "vpnc"
description = "Manages vpnc configuration"
readme = "README.md"
authors = [{ name="Tony Fortes Ramos", email="tony.fortesramos@ncubed.nl" }]
requires-python = ">=3.12"
keywords = ["ncubed", "vpnc", "vpn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: Linux",

    # Pick your license as you wish (see also "license" above)
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: System :: Networking",
]
dependencies = [
    "deepdiff~=9.1.0",
    "Jinja2~=3.1.6",
    "pydantic~=2.14.3",
    "pyroute2~=0.7.12",
    "PyYAML~=6.0.3",
    "tabulate~=0.10.0",
    "typer~=0.28.0",
    "vici~=6.0.3",
    "watchdog~=7.1.0",
    "packaging~=26.3",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "types-PyYAML",
    "types-tabulate",
]

[project.scripts]
vpnc = "vpnc.main:main"
vpnctl = "vpnc.ctl.main:app"

[tool.setuptools.dynamic]
version = {attr = "vpnc.__version__"}

[tool.setuptools.package-data]
"*" = ["*.j2"]
